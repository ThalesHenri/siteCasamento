{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'main/css/style.css' %}">
    <style>
    

/* 1. Reset e Base */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Montserrat', sans-serif;
    background-color: #697e50; 
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
}


.container {
    background: #ffffff;
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    width: 100%;
    max-width: 450px;
    margin: 80px auto 40px auto; /* Espaço para o header fixo */
}

h2 {
    color: #4A5334;
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.2em;
    margin-bottom: 25px;
    text-align: center;
}

/* 3. Estilização dos Campos */
.form-group {
    margin-bottom: 15px;
}

label {
    display: block;
    margin-bottom: 5px;
    color: #444;
    font-weight: 500;
    font-size: 0.9em;
}

input[type="text"],
input[type="email"],
input[type="password"],
input[type="tel"] {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 1rem;
    font-family: 'Montserrat', sans-serif;
    transition: all 0.3s ease;
}

input:focus {
    outline: none;
    border-color: #4A5334;
    box-shadow: 0 0 0 3px rgba(74, 83, 52, 0.1);
}

/* 4. Grid para Nome/Sobrenome e Senhas */
.row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}
/* 5. Botão de Registro */
.btn {
    width: 100%;
    padding: 14px;
    background-color: #4A5334;
    color: #EAE3D8;
    border: none;
    border-radius: 8px;
    font-size: 1.1em;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.3s ease;
    margin-top: 15px;
}

.btn:hover {
    background-color: #354c2d;
}

/* 6. Link de Login */
.login-link {
    text-align: center;
    margin-top: 20px;
    font-size: 0.9em;
    color: #666;
}

.login-link a {
    color: #4A5334;
    text-decoration: none;
    font-weight: 700;
}

.login-link a:hover {
    text-decoration: underline;
}

/* ============================================================
   RESPONSIVIDADE (MOBILE)
   ============================================================ */
@media (max-width: 600px) {
    body {
        justify-content: flex-start; /* Evita que o topo suma no scroll */
        padding-top: 100px;
    }

    .container {
        width: 95%;
        padding: 25px 20px;
    }

    /* Transforma as colunas duplas em simples no celular */
    .row {
        grid-template-columns: 1fr;
        gap: 0;
    }

    h2 {
        font-size: 1.8em;
    }

    input {
        font-size: 16px !important; /* Impede o zoom forçado no iPhone */
    }

    .footer {
        position: relative !important;
        margin-top: 30px;
    }
}        
    </style>
</head>
<body>
    <a href="{% url 'home' %}" class="logo">
        <img src="{% static 'main/assets/logotiposvg.svg' %}" alt="Logotipo Casamento" class="logo-img">
    </a>
    <header class="header">
        <h1>Ailka & Vínicius</h1>
        <nav class="header-nav">
            <a href="{% url 'home' %}">Início</a>
            <a href="{% url 'login' %}">Login</a>
        </nav>
    </header>

    <div class="container">
        <h2>Criar Conta</h2>

        {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="message {{ message.tags }}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="row">
                <div class="form-group">
                    <label for="first_name">Nome</label>
                    <input type="text" id="first_name" name="first_name" placeholder="">
                </div>
                <div class="form-group">
                    <label for="last_name">Sobrenome</label>
                    <input type="text" id="last_name" name="last_name" placeholder="">
                </div>
            </div>

            <div class="form-group">
                <label for="username">Usuário <span style="color: red;">*</span></label>
                <input type="text" id="username" name="username" required placeholder="Escolha um usuário único">
            </div>

            <div class="form-group">
                <label for="email">Email <span style="color: red;">*</span></label>
                <input type="email" id="email" name="email" required placeholder="seu@email.com">
            </div>

            <div class="form-group">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999">
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="password">Senha <span style="color: red;">*</span></label>
                    <input type="password" id="password" name="password" required placeholder="Mínimo 6 caracteres">
                </div>
                <div class="form-group">
                    <label for="password_confirm">Confirmar Senha <span style="color: red;">*</span></label>
                    <input type="password" id="password_confirm" name="password_confirm" required placeholder="Repita a senha">
                </div>
            </div>

            <button type="submit" class="btn">Registrar</button>
        </form>

        <div class="login-link">
            Já tem conta? <a href="{% url 'login' %}">Faça login aqui</a>
        </div>
    </div>

    <footer class="footer">
    <p>&copy; 2026 Ailka & Vínicius</p>
</footer>
</body>
</html>
